name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Emit lockfile for bootstrap
        run: |
          echo "LOCKFILE_GZIP_BASE64_BEGIN"
          gzip -c package-lock.json | base64 -w0
          echo
          echo "LOCKFILE_GZIP_BASE64_END"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
